[search]
location = "Toronto, Ontario, Canada"
keywords = [
    "DevOps",
    "SRE",
    "Software Developer"
]
blacklisted_terms = [
    "Senior",
    "Lead",
]

[linkedin]
time_filter = 86400
distance = 0

[llm]
model = "qwen3.5:4b"
minimum_score = 50
apply_immediately_threshold = 75
good_stretch_threshold = 60
bad_stretch_threshold = 50

career_goals = "Become the best programmer ever, maximize income, etc."
preferred_roles = [
    "Software Engineer",
    "Backend Engineer",
    "Systems Engineer",
    "DevOps Engineer",
    "SRE",
    "Infrastructure Engineer",
]
preferred_technologies = [
    "Linux",
    "Python",
    "C++",
    "Docker",
    "Kubernetes",
    "AWS",
]
excluded_roles = [
    "Frontend Developer",
    "UI Developer",
]
preferred_industries = [
    "aerospace",
    "defense",
    "infrastructure",
    "systems",
]
priorities = [
    "Programming-heavy work",
    "Opportunities for technical growth",
    "Strong compensation",
    "Interesting technical problems",
    "Backend/infrastructure work",
]
dealbreakers = [
    "Primarily frontend development",
    "Primarily manual QA/testing",
    "Unpaid work",
]
